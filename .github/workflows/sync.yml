name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 开启详细日志，方便查看运行过程
          set -x

          # 1. 配置 Git 机器人身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 2. 自动获取 Fork 上游克隆地址
          UPSTREAM_URL=$(gh api "repos/${{ github.repository }}" --jq '.parent.clone_url')

          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" == "null" ]; then
            echo "错误：无法自动获取上游仓库地址，请确认当前仓库是通过 Fork 创建的。"
            exit 1
          fi

          # 3. 注入认证 Token，彻底解决推送权限问题
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 4. 添加并拉取上游最新代码
          git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream --prune

          # 5. 原生识别上游默认分支（核心修复点：不依赖任何文本截取）
          git remote set-head upstream -a

          # 6. 强制重置本地代码对齐上游主分支
          git reset --hard upstream/HEAD

          # 7. 强制推送到你自己的仓库
          git push origin HEAD --force
