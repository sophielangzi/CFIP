name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream
        run: |
          # 1. 配置 Git 机器人身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 2. 通过 API 精准提取原作者仓库地址
          REPO_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}")
          UPSTREAM_URL=$(echo "$REPO_INFO" | jq -r '.parent.clone_url // empty')

          if [ -z "$UPSTREAM_URL" ]; then
            echo "错误：未能识别到上游仓库，请确认此仓库是通过 Fork 创建的。"
            exit 1
          fi

          echo "识别到上游地址: $UPSTREAM_URL"

          # 3. 配置带 Token 的远程推送链接
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 4. 拉取上游最新代码
          git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream

          # 5. 识别分支并强制对齐覆盖
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          UPSTREAM_BRANCH=$(git remote show upstream | sed -n '/HEAD branch/s/.*: //p')

          git checkout "$BRANCH"
          git reset --hard "upstream/$UPSTREAM_BRANCH"

          # 6. 强行推送到你的仓库
          git push origin "$BRANCH" --force
