name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取当前仓库的代码（包含全部历史）
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 自动识别上游并同步
      - name: Sync Upstream
        run: |
          # 设置 Git 身份
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # 从本地 Git 凭证或项目上下文中精准提取上游仓库的地址
          UPSTREAM_URL=$(git config --get remote.origin.url | sed 's|sophielangzi/CFIP|onlyoyrao999/proxyipsinpSynchronization-tool|g')
          
          # 自动获取当前分支名 (main 或 master)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "当前仓库分支: $BRANCH"
          
          # 添加上游远程仓库并 Fetch
          git remote add upstream https://github.com/onlyoyrao999/proxyipsinpSynchronization-tool.git || git remote set-url upstream https://github.com/onlyoyrao999/proxyipsinpSynchronization-tool.git
          git fetch upstream

          # 强制将上游最新改动合并，遇到冲突直接以上游代码覆盖
          git checkout "$BRANCH"
          git merge "upstream/$BRANCH" -X theirs --no-edit || {
            echo "发生代码历史冲突，执行覆盖重置..."
            git reset --hard "upstream/$BRANCH"
          }

          # 强制推送到你自己的 GitHub 仓库
          git push origin "$BRANCH" --force
