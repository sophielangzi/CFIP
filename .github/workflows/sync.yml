name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream via GitHub Official API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. 动态获取当前仓库的主分支名称 (main 或 master)
          BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')
          echo "当前仓库主分支: ${BRANCH}"

          # 2. 调用 GitHub 官方后端 API 进行无缝合并
          echo "正在向 GitHub 服务器发送同步合并请求..."
          
          RESPONSE=$(gh api repos/${{ github.repository }}/merge-upstream -f branch="${BRANCH}" 2>&1 || true)

          echo "服务端响应结果: ${RESPONSE}"

          # 3. 校验合并状态
          if echo "${RESPONSE}" | grep -q "Successfully fetched and merged"; then
            echo "🎉 成功从上游合并最新代码！"
          elif echo "${RESPONSE}" | grep -q "up to date"; then
            echo "✅ 当前仓库已是最新状态，无需更新。"
          else
            echo "ℹ️ 同步过程完成。"
          fi
