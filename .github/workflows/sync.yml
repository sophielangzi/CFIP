name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream via Official API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. 动态获取当前仓库的主分支名称 (main 或 master)
          BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')
          echo "当前仓库主分支: ${BRANCH}"

          # 2. 调用 GitHub 官方后端 API 发起云端直接合并
          echo "正在向 GitHub 服务器发送同步合并请求..."
          
          RESPONSE=$(gh api repos/${{ github.repository }}/merge-upstream -f branch="${BRANCH}" 2>&1 || true)

          echo "服务端响应结果: ${RESPONSE}"

          # 3. 判断合并结果
          if echo "${RESPONSE}" | grep -qE "Successfully fetched and merged|up to date|merge_type"; then
            echo "🎉 成功与上游原作者代码同步！"
          else
            echo "ℹ️ 处理完成或无需更新。"
          fi
