name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with Upstream via Server API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. 动态获取当前仓库的主分支
          BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')
          echo "当前主分支: ${BRANCH}"

          # 2. 调用 GitHub 云端 API 自动合并（绕过 git push 的 workflow 文件权限拦截）
          echo "正在向 GitHub 服务器发送同步请求..."
          
          RESPONSE=$(gh api repos/${{ github.repository }}/merge-upstream -f branch="${BRANCH}" 2>&1 || true)

          echo "服务端响应结果: ${RESPONSE}"

          # 3. 精准校验 API 响应状态
          if echo "${RESPONSE}" | grep -qE "Successfully fetched and merged|up to date|merge_type"; then
            echo "🎉 自动同步成功！原作者最新代码（包含工作流更新）已融合进你的仓库。"
          else
            echo "❌ 同步出现未知异常: ${RESPONSE}"
            exit 1
          fi
