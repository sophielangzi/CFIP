name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间上午 8:00 自动运行
  workflow_dispatch:     # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动获取当前仓库默认分支（main 或 master）
          DEFAULT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          
          # 通过 GitHub API 自动查询当前仓库对应的上游原作者仓库克隆地址
          UPSTREAM_URL=$(gh api repos/${{ github.repository }} --jq '.parent.clone_url')
          
          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" == "null" ]; then
            echo "错误：当前仓库不是 Fork 仓库或无法获取上游地址。"
            exit 1
          fi
          
          echo "自动识别到上游仓库地址: $UPSTREAM_URL"
          echo "当前分支: $DEFAULT_BRANCH"
          
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          git checkout "$DEFAULT_BRANCH"
          git merge "upstream/$DEFAULT_BRANCH" --no-edit || git merge "upstream/$DEFAULT_BRANCH" --allow-unrelated-histories --no-edit
          git push origin "$DEFAULT_BRANCH"
