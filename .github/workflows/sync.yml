name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动点击运行

permissions:
  contents: write
  workflows: write       # 核心：允许脚本修改和推送 .github/workflows 目录下的工作流文件

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Upstream Engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. 配置 Git 身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 2. 读取当前分支名
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # 3. 获取 Fork 上游仓库地址
          UPSTREAM_URL=$(gh api "repos/${{ github.repository }}" --jq '.parent.clone_url')

          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" = "null" ]; then
            echo "错误：未能识别上游仓库，请确认当前仓库是通过 Fork 创建的。"
            exit 1
          fi

          # 4. 配置上游并 Fetch 代码
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$BRANCH"

          # 5. 强制重置本地代码对齐上游
          git reset --hard "upstream/$BRANCH"

          # 6. 带 Token 强制推送到个人仓库
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$BRANCH" --force
