name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'  # 每天北京时间 8:00 自动运行
  workflow_dispatch:     # 支持手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync and Overwrite with Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1. 配置 Git 身份
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 2. 动态读取当前主分支名称
          BRANCH=$(gh api "repos/${{ github.repository }}" --jq '.default_branch')
          echo "当前主分支: ${BRANCH}"

          # 3. 尝试优先使用 API 无缝合并
          RESPONSE=$(gh api repos/${{ github.repository }}/merge-upstream -f branch="${BRANCH}" 2>&1 || true)

          if echo "${RESPONSE}" | grep -q "Successfully fetched and merged"; then
            echo "🎉 API 自动合并成功！"
            exit 0
          elif echo "${RESPONSE}" | grep -q "up to date"; then
            echo "✅ 代码已是最新，无需更新。"
            exit 0
          fi

          # 4. 若 API 因代码冲突拒绝合并，启动强行以原作者代码为准的覆盖逻辑
          echo "⚠️ 监测到代码冲突或 API 无法合并，启动强制对齐原作者（Upstream）模式..."

          UPSTREAM_URL=$(gh api "repos/${{ github.repository }}" --jq '.parent.clone_url')

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_URL}"
          git fetch upstream "${BRANCH}"

          # 5. 强行重置本地分支，无条件丢弃冲突改动，完全以原作者代码为准
          git reset --hard "upstream/${BRANCH}"

          # 6. 带权限强行推送到你的仓库
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "${BRANCH}" --force

          echo "🚀 冲突已解决：已强制使用原作者代码覆盖并更新！"
