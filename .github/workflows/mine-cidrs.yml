name: Mine Hot CIDRs

on:
  workflow_dispatch: # 允许手动触发
  schedule:
    - cron: '0 0 * * 0' # 每周日 00:00 (UTC) 自动执行一次

jobs:
  mine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run CIDR Miner
      run: python scripts/mine_hot_cidrs.py

    - name: Commit and Push Subnets
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add hot_cidrs.txt
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "docs: 自动全网大挖矿更新极品 IP 段 [skip ci]" && git pull --rebase origin main && git push)
